name: Sync portable cache snapshots

on:
  workflow_dispatch:
  # Bootstrap snapshots when this workflow is changed, then refresh from the VPS
  # every six hours so ephemeral Render deployments keep receiving warm caches.
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-cache-snapshots.yml
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: home-cache-snapshots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Snapshot VPS caches into the repository
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p backend/cache-seed/runtime

          sync_remote_file() {
            local remote_path="$1"
            local destination="$2"
            local size
            if ! size=$(ssh -o BatchMode=yes -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
              "sudo -n stat -c %s '$remote_path'" 2>/dev/null); then
              echo "Skipping missing/unreadable cache: $remote_path"
              return 0
            fi
            if ! [[ "$size" =~ ^[0-9]+$ ]] || [ "$size" -eq 0 ]; then
              echo "Skipping empty/invalid cache: $remote_path"
              return 0
            fi
            if [ "$size" -gt 80000000 ]; then
              echo "Skipping cache larger than 80 MB (GitHub file-size safety limit): $remote_path ($size bytes)"
              return 0
            fi
            echo "Snapshotting $remote_path ($size bytes)"
            ssh -o BatchMode=yes -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
              "sudo -n cat '$remote_path'" > "$destination"
            test -s "$destination"
          }

          DATA_DIR="/home/$VPS_USER/home-data"
          for name in \
            marvel_catalogue.json \
            marvel_web_series_catalogue.json \
            marvel_hindi_catalogue.json \
            dc_live_action_catalogue.json \
            dc_live_action_hindi_catalogue.json \
            dc_animated_catalogue.json \
            classics_catalogue.json \
            classics_web_series_tv_catalogue.json \
            classics_anime_tv_catalogue.json \
            regional_tv_prebuilt_cache.json \
            latest_hollywood_catalogue.json \
            latest_bollywood_catalogue.json \
            bollywood_torrent_matched_catalogue.json; do
            sync_remote_file "$DATA_DIR/$name" "backend/cache-seed/$name"
          done

          for name in \
            tmdb_movie_catalogue_cache.json \
            tmdb_search_metadata_cache.json \
            imdb_rating_cache.json \
            tmdb_ott_availability_cache.json \
            marvel_tv_catalogue_cache.json \
            dc_tv_catalogue_cache.json \
            regional_movie_prebuilt_cache.json \
            nexstream_cache.json \
            nexstream_episode_metadata_cache.json; do
            sync_remote_file "$DATA_DIR/$name" "backend/cache-seed/runtime/$name"
          done

          # Do not silently publish an empty OTT snapshot: Render runs cache-only
          # and would otherwise have no bundled availability data to serve.
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("backend/cache-seed/runtime/tmdb_ott_availability_cache.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("OTT cache snapshot is missing/empty; check VPS path and SSH permissions.")
          payload = json.loads(path.read_text(encoding="utf-8"))
          items = payload.get("items") if isinstance(payload, dict) else None
          if not isinstance(items, dict) or not items:
              raise SystemExit("OTT cache snapshot contains no items; refusing to publish an empty cache.")
          print(f"Validated OTT cache snapshot: {len(items)} entries")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- backend/cache-seed/
          if git diff --cached --quiet; then
            echo "Cache snapshots are already up to date."
            exit 0
          fi
          git commit -m "Refresh portable cache snapshots"
          git push origin HEAD:main
