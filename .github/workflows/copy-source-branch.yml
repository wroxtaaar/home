name: Replace with source branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout home
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository contents
        env:
          SOURCE_REPO: https://github.com/wroxtaaar/Torrent-Studio-Vercel-Render-Seedr.git
          SOURCE_BRANCH: fix-seedr-direct-browser-stream
        run: |
          set -e
          git clone --depth 1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" /tmp/source
          rm -rf /tmp/source/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy fix-seedr-direct-browser-stream exactly [source-copy]" || exit 0
          git push origin HEAD:main
