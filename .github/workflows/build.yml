name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: cp ../search_limits.json search_limits.json
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile backend/main.py backend/fullstack_app.py backend/nexstream.py backend/refresh_franchise_ott.py backend/refresh_bollywood_torrent_catalogue.py scripts/clean_cached_movie_catalogues.py scripts/enrich_catalogue_ott.py
      - run: python -m pip install -r backend/requirements.txt
