name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://new-test-dmkr.onrender.com/api/health
          echo
