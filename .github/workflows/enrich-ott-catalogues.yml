name: Enrich remaining OTT catalogues

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/OTT_ENRICHMENT_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-ott-catalogue-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-ott-enrichment]')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Enrich missing OTT entries on Oracle VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -eu
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/home"
          DATA_DIR="$HOME/home-data"
          SCRIPT="$APP_DIR/scripts/enrich_catalogue_ott.py"
          LOG="$DATA_DIR/catalogue_ott_enrichment_run.log"

          test -f "$SCRIPT" || { echo "Missing enrichment script: $SCRIPT"; exit 1; }
          test -d "$DATA_DIR" || { echo "Missing persistent data directory: $DATA_DIR"; exit 1; }
          curl -fsS http://127.0.0.1:10000/health
          echo

          if pgrep -af '[e]nrich_catalogue_ott.py' >/dev/null; then
            echo "OTT catalogue enrichment is already running on the VPS; refusing to start a duplicate."
            exit 0
          fi

          cd "$APP_DIR"
          echo "Starting resumable OTT enrichment of the five persistent Marvel/DC catalogues."
          echo "The script skips successful entries, backs up each catalogue before editing, and saves progress after each title."
          echo "A full run log is also written to: $LOG"
          python3 "$SCRIPT" 2>&1 | tee "$LOG"
          REMOTE

      - name: Sync enriched catalogues back to GitHub cache snapshots
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }
          git fetch origin main
          git checkout -B main origin/main

          mkdir -p backend/cache-seed
          for name in \
            marvel_catalogue.json \
            marvel_hindi_catalogue.json \
            dc_live_action_catalogue.json \
            dc_live_action_hindi_catalogue.json \
            dc_animated_catalogue.json; do
            echo "Downloading enriched $name"
            scp -p -P "$VPS_SSH_PORT" \
              "$VPS_USER@$VPS_HOST:/home/$VPS_USER/home-data/$name" \
              "backend/cache-seed/$name"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/cache-seed/marvel_catalogue.json \
            backend/cache-seed/marvel_hindi_catalogue.json \
            backend/cache-seed/dc_live_action_catalogue.json \
            backend/cache-seed/dc_live_action_hindi_catalogue.json \
            backend/cache-seed/dc_animated_catalogue.json

          if git diff --cached --quiet; then
            echo "Bundled cache snapshots already match the enriched VPS files."
            exit 0
          fi

          git commit -m "Refresh bundled Marvel and DC OTT-enriched catalogues"
          git push origin HEAD:main
